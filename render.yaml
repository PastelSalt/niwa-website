services:
  - type: web
    name: niwa-api
    env: node
    rootDir: backend
    buildCommand: npx pnpm install && npx pnpm run build
    startCommand: npx pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_URL
        value: https://niwa-website-six.vercel.app
    healthCheckPath: /health
